<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — Path·Finder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/css/base.css">
</head>
<body>
<div class="auth-shell">
  <div class="card auth-card">
    <div class="brand" style="margin-bottom:22px;"><span class="brand-mark">P</span> PATH·FINDER</div>
    <h1 id="authTitle">Student sign in</h1>
    <p id="authLead">Use your student number and portal password.</p>
    <div class="auth-error" id="authError"></div>
    <form id="loginForm">
      <div class="remembered" id="rememberedCard" hidden>
        <span class="remembered-avatar mono" id="rememberedInitials"></span>
        <div class="remembered-who">
          <strong id="rememberedName"></strong>
          <span class="mono" id="rememberedNumber"></span>
        </div>
        <button type="button" class="remembered-switch" id="notYouBtn">Not you?</button>
      </div>
      <div class="field" id="studentNumberField">
        <label for="studentNumber">Student number</label>
        <input type="text" id="studentNumber" placeholder="2023-00123-MN" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <label class="remember-check">
        <input type="checkbox" id="rememberMe" checked>
        Remember me on this device
      </label>
      <button type="submit" class="btn btn-block" id="submitBtn">Sign in</button>
    </form>
    <div class="auth-hint">Default password is your student number unless CCS staff has set a custom one for you.</div>
    <div class="auth-switch"><a href="/">← Back to portal selection</a></div>
  </div>
</div>
<script src="/shared/js/config.js"></script>
<script type="module">
import { apiPost, setToken, getToken } from "/shared/js/api.js";

if (getToken("student")) {
  window.location.href = "/student/dashboard.html";
}

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("authError");
const submitBtn = document.getElementById("submitBtn");
const numberInput = document.getElementById("studentNumber");
const passwordInput = document.getElementById("password");
const rememberMe = document.getElementById("rememberMe");

// Only the student number and first name are remembered — never the password.
const LAST_KEY = "pf_last_student";

function readRemembered() {
  try {
    return JSON.parse(localStorage.getItem(LAST_KEY) || "null");
  } catch {
    return null;
  }
}

function showRemembered(last) {
  const known = Boolean(last && last.studentNumber);
  document.getElementById("rememberedCard").hidden = !known;
  document.getElementById("studentNumberField").hidden = known;
  document.getElementById("authTitle").textContent = known ? `Welcome back${last.firstName ? `, ${last.firstName}` : ""}` : "Student sign in";
  document.getElementById("authLead").textContent = known
    ? "Enter your password to continue."
    : "Use your student number and portal password.";
  if (known) {
    numberInput.value = last.studentNumber;
    document.getElementById("rememberedName").textContent = [last.firstName, last.lastName].filter(Boolean).join(" ") || "Student";
    document.getElementById("rememberedNumber").textContent = last.studentNumber;
    document.getElementById("rememberedInitials").textContent =
      `${(last.firstName || last.studentNumber)[0]}${(last.lastName || "")[0] || ""}`.toUpperCase();
    passwordInput.focus();
  }
}

showRemembered(readRemembered());

document.getElementById("notYouBtn").addEventListener("click", () => {
  try {
    localStorage.removeItem(LAST_KEY);
  } catch {}
  numberInput.value = "";
  passwordInput.value = "";
  errorBox.classList.remove("show");
  showRemembered(null);
  numberInput.focus();
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.classList.remove("show");
  submitBtn.disabled = true;
  submitBtn.textContent = "Signing in…";
  try {
    const studentNumber = numberInput.value.trim();
    const password = passwordInput.value;
    const data = await apiPost("/api/auth/student/login", { studentNumber, password }, "student", { noQueue: true });
    setToken("student", data.token);
    localStorage.setItem("pf_student_profile", JSON.stringify(data.student));
    try {
      if (rememberMe.checked) {
        const { firstName, lastName } = data.student;
        localStorage.setItem(LAST_KEY, JSON.stringify({ studentNumber: data.student.studentNumber, firstName, lastName }));
      } else {
        localStorage.removeItem(LAST_KEY);
      }
    } catch {}
    window.location.href = "/student/dashboard.html";
  } catch (err) {
    errorBox.textContent = err.message || "Unable to sign in. Check your connection and try again.";
    errorBox.classList.add("show");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
